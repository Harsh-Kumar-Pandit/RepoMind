services:
  postgres:
    image: postgres:16
    container_name: repo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: